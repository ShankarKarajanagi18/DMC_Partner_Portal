<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Plan &amp; Trip — DMC Partner Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="brand/planandtrip-favicon-white.png">
<style>
@font-face{font-family:'Avenir Next';src:url('fonts/avenir-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Avenir Next';src:url('fonts/avenir-medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Avenir Next';src:url('fonts/avenir-demi.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Avenir Next';src:url('fonts/avenir-bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--navy:#191970;--navy-2:#10103a;--primary:#2364AA;--primary-l:#3DA5D9;--cream:#F4ECE5;--cream-2:#e3d8c8;--gold:#FEC601;--gold-2:#d8a800;--ink:#F4ECE5;--body:#cdd3e8;--mut:#9aa2c4;--line:rgba(244,236,229,.16);--line-b:rgba(244,236,229,.24);--card:rgba(244,236,229,.06);--ok:#24F95C;--warn:#FEC601;--bad:#F92444;
 --disp:'Jost','Avenir Next',system-ui,sans-serif;--sans:'Avenir Next','Jost',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55;
 background:linear-gradient(160deg,#191970 0%,#101038 55%,#1b2470 100%);background-attachment:fixed}
h1,h2,h3,h4,.h2{font-family:var(--disp);color:var(--ink);letter-spacing:.005em;font-weight:800;text-transform:uppercase}
a{color:inherit}.hidden{display:none!important}.sp{flex:1}.mut{color:var(--mut);text-transform:none;font-family:var(--sans)}
.grad{background:linear-gradient(100deg,var(--primary-l),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
/* animated background blobs */
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-deco i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.34;animation:float 16s ease-in-out infinite}
.bg-deco .b1{width:520px;height:520px;left:-150px;top:-140px;background:radial-gradient(circle,rgba(58,120,194,.6),transparent 70%)}
.bg-deco .b2{width:560px;height:560px;right:-180px;top:2%;background:radial-gradient(circle,rgba(216,177,90,.4),transparent 70%);animation-delay:-5s}
.bg-deco .b3{width:480px;height:480px;left:16%;bottom:-220px;background:radial-gradient(circle,rgba(244,236,229,.2),transparent 70%);animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-28px)}}
.nav{display:flex;align-items:center;gap:14px;padding:13px clamp(18px,4vw,46px);background:rgba(13,15,52,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.logo{display:flex;align-items:center;gap:14px;cursor:pointer}.logo img{height:52px;display:block}
.logo .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;border-left:1px solid var(--line);padding-left:13px}
.site-foot{position:relative;z-index:2;margin-top:34px;padding:34px 5vw;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;background:rgba(13,15,52,.45);backdrop-filter:blur(10px)}
.site-foot img{height:34px;opacity:.92}.site-foot .by{font-family:var(--sans);color:var(--body);font-size:14px}.site-foot .by b{color:var(--gold)}.site-foot .cp{font-size:12px;color:var(--mut)}
.badge{background:rgba(216,177,90,.14);border:1px solid rgba(216,177,90,.45);padding:6px 12px;border-radius:100px;font-size:12px;font-weight:700;color:var(--gold);font-family:var(--sans)}
.navbtn{padding:9px 16px;border-radius:100px;border:2px solid var(--line-b);cursor:pointer;font-size:13px;font-weight:700;background:rgba(244,236,229,.04);color:var(--cream);transition:.25s}
.navbtn:hover{border-color:var(--gold);color:var(--gold)}.navbtn.on{background:linear-gradient(105deg,var(--cream),var(--cream-2));border-color:transparent;color:var(--navy)}
.wrap{max-width:1180px;margin:26px auto;padding:0 clamp(16px,4vw,40px);position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(11px);margin-bottom:18px;box-shadow:0 30px 70px -46px rgba(0,0,0,.6);
 animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
h1{font-size:clamp(26px,3.4vw,40px);margin:.15em 0}.h2{font-size:19px;margin:6px 0 12px}
.grid{display:grid;gap:15px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:12px;color:var(--mut);margin:9px 0 4px;font-family:var(--sans)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-b);background:rgba(13,15,52,.35);color:var(--ink);font-size:14px;font-family:var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 22px;border-radius:100px;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:14px;font-family:var(--sans);transition:.25s}
.btn.teal{background:linear-gradient(105deg,var(--cream),var(--cream-2));color:var(--navy);box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.btn.teal:hover{transform:translateY(-2px);box-shadow:0 18px 38px -12px rgba(216,177,90,.45)}
.btn.orange{background:linear-gradient(105deg,var(--gold),#c99b3f);color:#241a00}.btn.orange:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(244,236,229,.04);border-color:var(--line-b);color:var(--cream)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.kpi{display:flex;gap:15px;flex-wrap:wrap}.kbox{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.3s}
.kbox:hover{border-color:var(--gold);transform:translateY(-4px)}.kbox .big{font-size:27px;font-weight:800;font-family:var(--disp);color:var(--gold)}.kbox small{color:var(--mut)}
.pill{display:inline-block;padding:4px 11px;border-radius:100px;font-size:11px;font-weight:700;font-family:var(--sans)}
.st-verified,.st-published,.st-approved{background:rgba(127,216,160,.16);border:1px solid rgba(127,216,160,.5);color:#bff0cf}
.st-in_review,.st-submitted,.st-docs_submitted{background:rgba(232,160,33,.16);border:1px solid rgba(232,160,33,.5);color:#f4d58c}
.st-registered,.st-draft{background:rgba(159,176,189,.14);border:1px solid var(--line);color:var(--mut)}
.st-rejected,.st-suspended{background:rgba(224,90,74,.16);border:1px solid rgba(224,90,74,.5);color:#f2b0a6}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--gold);font-weight:700;font-family:var(--sans);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.doc{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;background:var(--card);transition:.25s}.doc:hover{border-color:var(--primary-l)}
.doc .up{margin-left:auto}.chk{width:22px;height:22px;border-radius:7px;border:1px solid var(--line-b);display:grid;place-items:center;font-size:12px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0a2a17}
.steps{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}.stp{padding:8px 15px;border-radius:100px;border:1px solid var(--line-b);font-size:12.5px;font-weight:700;color:var(--body);cursor:pointer;font-family:var(--sans);transition:.25s}.stp:hover{border-color:var(--gold);color:var(--gold)}.stp.on{background:linear-gradient(105deg,var(--cream),var(--cream-2));border-color:transparent;color:var(--navy)}
.rowb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--mut);margin-top:6px;font-family:var(--sans)}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}.logo .sub{display:none}}
</style></head>
<body>
<div class="bg-deco"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="nav">
  <div class="logo"><img src="brand/planandtrip-white-trim.png" alt="Plan & Trip"><span class="sub">DMC Partner Portal</span></div>
  <div class="sp"></div>
  <span class="badge" id="whoami">Not signed in</span>
  <div class="navbtn" id="navlogout" onclick="logout()" style="display:none">Log out</div>
</div>
<div class="wrap" id="app"></div>
<footer class="site-foot">
  <img src="brand/brilliant-white-h.svg" alt="Brilliant AI">
  <div class="by">Plan &amp; Trip is a product by <b>Brilliant AI</b></div>
  <div class="cp">© 2026 Brilliant AI Travel &amp; Expedition · All rights reserved</div>
</footer>

<script>
/* ---------- country verification rules engine ---------- */
const UNIVERSAL=["Business Registration / Incorporation","Authorized Signatory ID","Bank Account Proof","Company Address Proof"];
const COUNTRY_RULES={
 IN:{name:"India",docs:["GSTIN certificate","Ministry of Tourism / IATA / TAAI recognition"],approver:"Lead"},
 AE:{name:"UAE",docs:["DED Trade License","DTCM / Dept. of Tourism license"],approver:"Lead"},
 TH:{name:"Thailand",docs:["TAT (Tourism Authority of Thailand) license"],approver:"Lead"},
 SG:{name:"Singapore",docs:["STB Travel Agent license (TA number)"],approver:"Lead"},
 FR:{name:"France",docs:["EU VAT ID","Package-Travel insurance (EU Dir. 2015/2302)","Registre des opérateurs de voyages (Atout France)"],approver:"Lead"},
 IT:{name:"Italy",docs:["EU VAT ID (Partita IVA)","Package-Travel insurance (EU Dir. 2015/2302)"],approver:"Lead"},
 GR:{name:"Greece",docs:["EU VAT ID (AFM)","GNTO (EOT) travel agency license","Package-Travel insurance"],approver:"Lead"},
 US:{name:"USA",docs:["EIN (IRS)","Seller-of-Travel registration (CA/FL/WA/HI if applicable)"],approver:"Lead"},
 MA:{name:"Morocco",docs:["Ministry of Tourism agency license (Licence A)"],approver:"TA"},
 ID:{name:"Indonesia",docs:["Tourism Business Registration (TDUP)"],approver:"TA"},
 VN:{name:"Vietnam",docs:["International Travel Business License (VNAT)"],approver:"TA"},
 KH:{name:"Cambodia",docs:["Ministry of Tourism travel-agency license"],approver:"TA"},
 BT:{name:"Bhutan",docs:["Tourism Council of Bhutan (TCB) certificate"],approver:"TA"},
 JP:{name:"Japan",docs:["Travel Agency registration (JTA)"],approver:"Lead"},
 MG:{name:"Madagascar",docs:["Ministry of Tourism operating license"],approver:"TA"},
};
const HIGH_RISK=new Set([]); // demo: none flagged
function requiredDocs(cc){const r=COUNTRY_RULES[cc]||{docs:[]};return UNIVERSAL.concat(r.docs);}
function approverFor(cc){return (COUNTRY_RULES[cc]||{}).approver||"TA";}
function riskScore(dmc){let s=20; if(!dmc.website)s+=15; if(HIGH_RISK.has(dmc.country_code))s+=50;
  const done=Object.values(dmc.docs||{}).filter(Boolean).length, need=requiredDocs(dmc.country_code).length;
  s+= Math.round((1-done/Math.max(1,need))*30); return Math.min(100,s);}

/* ---------- state ---------- */
const TIERMULT={"3-Star":1.0,"Deluxe":1.14,"Premium":1.34};
let DATA={countries:[]};
let S={view:"auth",mode:"signup",dmc:null,vstep:1,pkgDraft:null};
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/"/g,'&quot;');}

async function loadData(){try{const r=await fetch('data/Countries.xlsx');if(r.ok){const wb=XLSX.read(await r.arrayBuffer(),{type:'array'});DATA.countries=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}}catch(e){}
 if(!DATA.countries.length)DATA.countries=Object.keys(COUNTRY_RULES).map(cc=>({country_code:cc,country:COUNTRY_RULES[cc].name}));}

/* ---------- render ---------- */
function render(){
 $("whoami").textContent = S.dmc? (S.dmc.company_name+" · "+prettyStatus(S.dmc.status)) : "Not signed in";
 $("navlogout").style.display = S.dmc?"block":"none";
 const v={auth:vAuth,verify:vVerify,dashboard:vDash,packages:vPackages,pkgnew:vPkgNew,payouts:vPayouts}[S.view]||vAuth;
 $("app").innerHTML = (S.dmc?tabs():"") + v();
}
function prettyStatus(s){return (s||"").replace(/_/g," ");}
function tabs(){const t=[["dashboard","Dashboard"],["packages","Packages"],["verify","Verification"],["payouts","Payouts"]];
 return `<div class="steps">${t.map(x=>`<div class="stp ${S.view===x[0]||(x[0]==='packages'&&S.view==='pkgnew')?'on':''}" onclick="go('${x[0]}')">${x[1]}</div>`).join("")}</div>`;}
function go(v){S.view=v;render();}

/* AUTH */
function vAuth(){const su=S.mode==="signup";
 return `<div class="card" style="max-width:560px;margin:6vh auto">
  <h1>${su?"Register your DMC":"Partner sign in"}</h1>
  <p class="mut">List your packages on Plan &amp; Trip. Global partners welcome — verification is tailored to your country.</p>
  <div class="rowb" style="margin:10px 0 14px"><div class="navbtn ${su?'on':''}" onclick="S.mode='signup';render()">Register</div><div class="navbtn ${!su?'on':''}" onclick="S.mode='login';render()">Sign in</div></div>
  ${su?`
   <div class="grid g2"><div><label>Company name</label><input id="f_name" placeholder="e.g. Bali Bliss DMC"></div>
     <div><label>Country</label><select id="f_cc">${DATA.countries.map(c=>`<option value="${c.country_code}">${c.country} (${c.country_code})</option>`).join("")}</select></div></div>
   <div class="grid g2"><div><label>Contact name</label><input id="f_contact" placeholder="Full name"></div><div><label>Work email</label><input id="f_email" placeholder="you@company.com"></div></div>
   <div class="grid g2"><div><label>Phone</label><input id="f_phone" placeholder="+.."></div><div><label>Website</label><input id="f_web" placeholder="https://"></div></div>
   <div><label>Default currency</label><select id="f_cur"><option>USD</option><option>INR</option><option>EUR</option><option>AED</option><option>THB</option><option>SGD</option></select></div>
   <button class="btn teal" style="width:100%;margin-top:14px" onclick="doSignup()">Create partner account →</button>`
  :`<label>Work email</label><input id="f_email" placeholder="you@company.com">
    <button class="btn teal" style="width:100%;margin-top:14px" onclick="doLogin()">Sign in</button>
    <p class="note">Demo: any email signs into a sample verified DMC.</p>`}
 </div>`;}
function doSignup(){const cc=$("f_cc").value;
 S.dmc={dmc_id:"DMC"+Date.now().toString().slice(-6),company_name:$("f_name").value||"New DMC",country_code:cc,
  contact_name:$("f_contact").value,email:$("f_email").value,phone:$("f_phone").value,website:$("f_web").value,
  currency:$("f_cur").value,status:"registered",kyc_level:0,docs:{},packages:[],payouts:[]};
 S.dmc.risk_score=riskScore(S.dmc); S.view="verify";S.vstep=1;render();}
function doLogin(){S.dmc={dmc_id:"DMC000042",company_name:"Bali Bliss DMC",country_code:"ID",contact_name:"Wayan S.",
  email:$("f_email").value||"partner@balibliss.com",website:"https://balibliss.example",currency:"USD",status:"verified",kyc_level:2,
  docs:Object.fromEntries(requiredDocs("ID").map(d=>[d,true])),risk_score:22,
  packages:[{pkg_id:"PKGDEMO1",title:"Bali Bliss — 6N Beaches & Temples",days:6,nights:5,category:"Beaches",status:"published",
    pricing:pricingFor(46000),terms:{deposit_pct:25,balance_due_days:30,commission_pct:12,cancellation_policy:"Free till 7 days"}}],
  payouts:[{payout_id:"PO1001",booking_id:"BK5521",type:"deposit",gross:92000,commission:11040,net_to_dmc:80960,status:"released",currency:"INR",date:"2026-07-10"}]};
 S.view="dashboard";render();}
function logout(){S.dmc=null;S.view="auth";render();}

/* VERIFICATION */
function vVerify(){const d=S.dmc,cc=d.country_code,req=requiredDocs(cc),done=req.filter(x=>d.docs[x]).length;
 const rule=COUNTRY_RULES[cc]||{docs:[],approver:"TA"};
 return `<div class="card">
  <div class="rowb"><h1 style="margin:0">Verification — ${rule.name||cc}</h1><span class="pill st-${d.status}">${prettyStatus(d.status)}</span></div>
  <p class="mut">Your country determines the required documents. Approver authority: <b>${approverFor(cc)}</b> · Risk score: <b>${d.risk_score}</b>/100 · KYC level: <b>L${d.kyc_level}</b></p>
  <div class="h2">Required documents (${done}/${req.length})</div>
  ${req.map((doc,i)=>`<div class="doc"><div class="chk ${d.docs[doc]?'on':''}">${d.docs[doc]?'✓':''}</div>
     <div>${doc}${i<UNIVERSAL.length?' <span class="mut">· universal</span>':' <span class="mut">· '+(rule.name||cc)+' pack</span>'}</div>
     <div class="up"><button class="btn ghost" onclick="uploadDoc('${esc(doc)}')">${d.docs[doc]?'Replace':'Upload'}</button></div></div>`).join("")}
  <div class="rowb" style="margin-top:14px">
    <button class="btn teal" onclick="submitDocs()" ${done<req.length?'style="opacity:.5;pointer-events:none"':''}>Submit for review →</button>
    <span class="note">${done<req.length?('Upload all '+req.length+' documents to submit.'):'All documents attached — ready to submit.'}</span>
  </div>
  <p class="note">Prototype: “upload” attaches a placeholder reference; the backend rules engine records docs, computes risk, and routes to the right approver (${approverFor(cc)}).</p>
 </div>`;}
function uploadDoc(doc){S.dmc.docs[doc]=true;S.dmc.risk_score=riskScore(S.dmc);render();}
function submitDocs(){S.dmc.status="in_review";render();
 setTimeout(()=>{const cc=S.dmc.country_code;S.dmc.status="verified";S.dmc.kyc_level=(COUNTRY_RULES[cc]&&COUNTRY_RULES[cc].docs.length)?2:1;render();
   alert("Verification approved (demo). KYC level L"+S.dmc.kyc_level+" — you can now publish packages.");},1200);}

/* DASHBOARD */
function vDash(){const d=S.dmc,pubs=d.packages.filter(p=>p.status==='published').length;
 const gmv=d.payouts.reduce((s,p)=>s+(p.gross||0),0), net=d.payouts.reduce((s,p)=>s+(p.net_to_dmc||0),0);
 return `<div class="card"><h1>Welcome, ${d.company_name}</h1>
   <p class="mut">${(COUNTRY_RULES[d.country_code]||{}).name||d.country_code} · <span class="pill st-${d.status}">${prettyStatus(d.status)}</span> · KYC L${d.kyc_level}</p>
   <div class="kpi" style="margin-top:12px">
     <div class="kbox"><small>Packages</small><div class="big">${d.packages.length}</div></div>
     <div class="kbox"><small>Published</small><div class="big">${pubs}</div></div>
     <div class="kbox"><small>Gross bookings</small><div class="big">₹${gmv.toLocaleString('en-IN')}</div></div>
     <div class="kbox"><small>Net payouts</small><div class="big">₹${net.toLocaleString('en-IN')}</div></div>
   </div></div>
  ${d.status!=='verified'?`<div class="card"><div class="h2">Finish verification</div><p class="mut">Complete your country document checklist to start publishing.</p><button class="btn teal" onclick="go('verify')">Go to verification →</button></div>`:
   `<div class="card"><div class="rowb"><div class="h2" style="margin:0">Your packages</div><div class="sp"></div><button class="btn teal" onclick="newPkg()">＋ New package</button></div>
     ${pkgTable(d.packages)}</div>`}`;}

/* PACKAGES */
function vPackages(){const d=S.dmc;
 if(d.status!=='verified')return `<div class="card"><div class="h2">Verification required</div><p class="mut">Publish access unlocks after verification.</p><button class="btn teal" onclick="go('verify')">Go to verification →</button></div>`;
 return `<div class="card"><div class="rowb"><h1 style="margin:0">Packages</h1><div class="sp"></div><button class="btn teal" onclick="newPkg()">＋ New package</button></div>
   ${pkgTable(d.packages)}</div>
  <div class="card"><div class="h2">📥 Bulk upload a package</div>
    <p class="mut">Download the format, fill it in, and upload — or upload a PDF brochure. We run a basic check before it goes for approval.</p>
    <div class="rowb" style="margin:10px 0">
      <button class="btn teal" onclick="downloadTemplate()">⬇ Download Excel template</button>
      <label class="btn ghost" style="cursor:pointer">⬆ Upload Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(this.files[0])"></label>
      <label class="btn ghost" style="cursor:pointer">⬆ Upload PDF<input type="file" accept="application/pdf" style="display:none" onchange="handlePDF(this.files[0])"></label>
    </div>
    <div id="importbox"></div>
  </div>`;}
function pkgTable(pk){if(!pk.length)return `<p class="mut" style="margin-top:10px">No packages yet — create your first, or bulk-upload below.</p>`;
 return `<table><tr><th>Title</th><th>Days</th><th>From (3★, 2pax)</th><th>Commission</th><th>Valid till</th><th>Status</th><th></th></tr>
  ${pk.map(p=>`<tr><td>${p.title}${p.source?` <span class="pill st-draft">${p.source}</span>`:''}</td><td>${p.days}N</td><td>₹${((p.pricing&&p.pricing["3-Star"]&&p.pricing["3-Star"].pax2)||0).toLocaleString('en-IN')}</td>
    <td>${(p.terms&&p.terms.commission_pct)||'-'}%</td><td>${p.expiry||'-'}</td><td><span class="pill st-${p.status}">${prettyStatus(p.status)}</span></td>
    <td>${p.status==='approved'?`<button class="btn ghost" onclick="publishPkg('${p.pkg_id}')">Publish</button>`:''}
      ${(p.status==='approved'||p.status==='published')?`<button class="btn ghost" onclick="downloadFormatted('${p.pkg_id}')">⬇ Formatted plan</button>`:''}</td></tr>`).join("")}</table>`;}

/* ---------- Excel template + upload + PDF + validation ---------- */
const PKG_COLS=["title","country_code","cities","route","nights","days","category","focus","difficulty","meals_plan","transport","inclusions","base_price_inr","deposit_pct","balance_due_days","commission_pct","cancellation_policy","validity_expiry"];
const DAY_COLS=["day","day_title","city","narrative"];
function downloadTemplate(){
 const wb=XLSX.utils.book_new();
 const example=["Bali Beaches & Temples","ID","Ubud, Kuta, Uluwatu","Ubud > Kuta > Uluwatu",5,6,"Beaches","Beaches, temples & rice terraces","Easy","Breakfast + 1 dinner","Private van & transfers","Hotels; Transfers; Guide; Activities",46000,25,30,12,"Free till 7 days","2026-12-20"];
 const ps=XLSX.utils.aoa_to_sheet([PKG_COLS,example]);
 const ds=XLSX.utils.aoa_to_sheet([DAY_COLS,
   [1,"Arrival in Bali","Bali","Arrive, check-in, sunset at Kuta."],
   [2,"Ubud & rice terraces","Ubud","Tegallalang terraces and Monkey Forest."],
   [3,"Temples day","Bali","Tirta Empul and Uluwatu Kecak dance."],
   [4,"Free / optional","Bali","Beach day or optional water sports."],
   [5,"South Bali","Uluwatu","Padang Padang beach and GWK."],
   [6,"Departure","Bali","Leisure, shopping and departure."]]);
 const notes=XLSX.utils.aoa_to_sheet([["Plan & Trip — DMC Package upload template"],
   ["Fill the 'Package' sheet (one row) and the 'DayWise' sheet (one row per day)."],
   ["Required: title, days, base_price_inr, validity_expiry (YYYY-MM-DD), and at least 1 DayWise row."],
   ["Pricing for all pax/tiers is auto-computed from base_price_inr; you can adjust after upload."]]);
 XLSX.utils.book_append_sheet(wb,notes,"README");
 XLSX.utils.book_append_sheet(wb,ps,"Package");
 XLSX.utils.book_append_sheet(wb,ds,"DayWise");
 XLSX.writeFile(wb,"PlanAndTrip_DMC_Package_Template.xlsx");
}
function handleExcel(file){if(!file)return;const fr=new FileReader();
 fr.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
   const pkS=wb.Sheets["Package"]||wb.Sheets[wb.SheetNames.find(n=>/pack/i.test(n))||wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(pkS,{defval:""}); const p=rows[0]||{};
   const dwS=wb.Sheets["DayWise"]||wb.Sheets[wb.SheetNames.find(n=>/day/i.test(n))];
   const days=dwS?XLSX.utils.sheet_to_json(dwS,{defval:""}):[];
   const pkg=fromExcel(p,days); const rep=validateExcel(pkg,days);
   S.importPkg=pkg;S.importReport=rep;showImport(file.name,"Excel");
 }catch(err){document.getElementById("importbox").innerHTML=`<p style="color:var(--bad)">Couldn't read that Excel file: ${err.message}. Use the template.</p>`;}};
 fr.readAsArrayBuffer(file);}
function fromExcel(p,days){const base=+p.base_price_inr||0;
 return {pkg_id:"PKG"+Date.now().toString().slice(-6),title:p.title||"",country_code:p.country_code||S.dmc.country_code,
   cities:p.cities||"",route:p.route||"",nights:+p.nights||0,days:+p.days||days.length,category:p.category||"Beaches",
   focus:p.focus||"",difficulty:p.difficulty||"Moderate",meals_plan:p.meals_plan||"",transport:p.transport||"",
   inclusions:p.inclusions||"",base:base,expiry:normDate(p.validity_expiry),source:"Excel",
   terms:{deposit_pct:+p.deposit_pct||25,balance_due_days:+p.balance_due_days||30,commission_pct:+p.commission_pct||12,cancellation_policy:p.cancellation_policy||"Free till 7 days"},
   pricing:pricingFor(base),
   daywise:days.map(d=>({day:+d.day||0,day_title:d.day_title||"",city:d.city||"",narrative:d.narrative||""}))};}
function normDate(v){if(!v)return"";if(typeof v==="number"){const dt=XLSX.SSF?XLSX.SSF.parse_date_code(v):null;if(dt)return `${dt.y}-${String(dt.m).padStart(2,'0')}-${String(dt.d).padStart(2,'0')}`;}
 const d=new Date(v);return isNaN(d)?String(v):d.toISOString().slice(0,10);}
function validateExcel(p,days){const r=[];
 r.push(chk("Title provided",!!p.title));
 r.push(chk("Number of days provided",p.days>0));
 r.push(chk("Itinerary / day-wise plan provided",days.length>0));
 if(days.length&&p.days&&days.length!==p.days)r.push(warn("Day rows ("+days.length+") don't match 'days' ("+p.days+")"));
 r.push(chk("Cost / base price provided",p.base>0));
 r.push(expiryCheck(p.expiry));
 r.push(p.terms.commission_pct>0?ok("Commission set ("+p.terms.commission_pct+"%)"):warn("Commission % missing — default 12% applied"));
 r.push(p.inclusions?ok("Inclusions listed"):warn("Inclusions not listed"));
 return r;}
function expiryCheck(v){if(!v)return fail("Validity / expiry date missing");
 const d=new Date(v);if(isNaN(d))return warn("Expiry date not understood: "+v);
 if(d< new Date())return fail("Package already expired ("+v+")");
 return ok("Valid until "+v);}
function chk(l,c){return c?ok(l):fail(l+" — missing");}
function ok(l){return{level:"ok",label:l}}function warn(l){return{level:"warn",label:l}}function fail(l){return{level:"fail",label:l}}

function handlePDF(file){if(!file)return;const box=document.getElementById("importbox");box.innerHTML=`<p class="mut">Reading PDF…</p>`;
 const fr=new FileReader();fr.onload=async e=>{try{
   let text="";
   if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
     const pdf=await pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise;
     for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();text+=" "+c.items.map(t=>t.str).join(" ");}}
   const rep=validateText(text);
   const pkg={pkg_id:"PKG"+Date.now().toString().slice(-6),title:file.name.replace(/\.pdf$/i,""),country_code:S.dmc.country_code,
     days:(text.match(/day\s*(\d+)/ig)||[]).length||0,base:extractPrice(text),expiry:extractDate(text),source:"PDF",
     category:"Beaches",terms:{deposit_pct:25,balance_due_days:30,commission_pct:12,cancellation_policy:"Free till 7 days"},
     pricing:pricingFor(extractPrice(text)||46000),daywise:[]};
   S.importPkg=pkg;S.importReport=rep;showImport(file.name,"PDF");
 }catch(err){box.innerHTML=`<p style="color:var(--bad)">Couldn't read that PDF: ${err.message}</p>`;}};
 fr.readAsArrayBuffer(file);}
function validateText(t){t=(t||"").toLowerCase();const r=[];
 r.push(t.length>200?ok("Document has readable content"):fail("Little/no text found — is it a scanned image?"));
 r.push(/day\s*1|itinerary|day-wise|day wise/.test(t)?ok("Itinerary / day plan detected"):fail("No itinerary/day plan detected"));
 r.push(/₹|rs\.?|usd|\$|price|cost|per person|per pax|tariff/.test(t)?ok("Cost / pricing detected"):fail("No cost/pricing detected"));
 r.push(/valid|validity|expiry|expires|till|until|'til/.test(t)?ok("Validity / expiry mentioned"):warn("No validity/expiry date found — add one before approval"));
 r.push(/inclusion|inclusive|includes|included/.test(t)?ok("Inclusions mentioned"):warn("Inclusions not clearly listed"));
 return r;}
function extractPrice(t){const m=(t||"").replace(/,/g,"").match(/(?:₹|rs\.?|inr|usd|\$)\s*(\d{4,7})/i);return m?+m[1]:0;}
function extractDate(t){const m=(t||"").match(/(\d{4}-\d{2}-\d{2})|(\d{1,2}\s+\w{3,9}\s+20\d{2})/);return m?normDate(m[0]):"";}

function showImport(fname,kind){const rep=S.importReport,fails=rep.filter(x=>x.level==="fail").length;
 document.getElementById("importbox").innerHTML=`
  <div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:6px">
   <div class="rowb"><b>${kind} check — ${fname}</b><span class="sp"></span><span class="pill ${fails?'st-rejected':'st-verified'}">${fails?fails+' issue(s)':'basic checks passed'}</span></div>
   <div style="margin:10px 0">${rep.map(x=>`<div style="margin:4px 0;color:${x.level==='fail'?'#f2b0a6':x.level==='warn'?'#f4d58c':'#a8f0c0'}">${x.level==='fail'?'✕':x.level==='warn'?'!':'✓'} ${x.label}</div>`).join("")}</div>
   <div class="rowb"><button class="btn teal" onclick="submitImported()" ${fails?'style="opacity:.5;pointer-events:none"':''}>Send for approval →</button>
     ${fails?'<span class="note">Fix the ✕ items in your file and re-upload.</span>':'<span class="note">Passes basic checks — an admin ('+approverFor(S.dmc.country_code)+' authority) will review it next.</span>'}</div>
  </div>`;}
function submitImported(){const p=S.importPkg;p.status="submitted";S.dmc.packages.unshift(p);S.importPkg=null;S.importReport=null;render();
 setTimeout(()=>{p.status="approved";render();alert('Approved by admin (demo). It now shows in your account. Use “⬇ Formatted plan” to export the standardized file for the main site (and “Publish” to push live).');},1500);}

function downloadFormatted(id){const p=S.dmc.packages.find(x=>x.pkg_id===id);if(!p)return;
 const itin_id="DMC"+String(p.pkg_id).slice(-4);
 const dw=(p.daywise&&p.daywise.length)?p.daywise:Array.from({length:p.days||1},(_,i)=>({day:i+1,day_title:"Day "+(i+1),city:(p.cities||"").split(",")[0]||"",narrative:"Day "+(i+1)+" plan."}));
 const itHead=["itin_id","country_code","title","route","source","provider","verified","tag","nights","days","price_from_inr","rating","reviews","meals_plan","transport","focus","difficulty","cities","cancellation","type","image_seed"];
 const itRow=[itin_id,p.country_code,p.title,p.route||p.cities,"DMC",S.dmc.company_name,"Yes","Best Seller",p.nights||"",p.days||"",(p.pricing["3-Star"].pax2)||p.base,4.5,0,p.meals_plan||"Breakfast",p.transport||"Private transfers",p.focus||"",p.difficulty||"Moderate",p.cities||"",(p.terms&&p.terms.cancellation_policy)||"","DMC",""];
 const dwHead=["itin_id","day","day_title","theme","city","narrative","tags"];
 const dwRows=dw.map(d=>[itin_id,d.day,d.day_title||("Day "+d.day),"",d.city||"",d.narrative||"",""]);
 const prHead=["itin_id","tier","pax2","pax4","pax6","pax8","pax10","pax12","currency"];
 const prRows=Object.keys(p.pricing).map(t=>[itin_id,t,p.pricing[t].pax2,p.pricing[t].pax4,p.pricing[t].pax6,p.pricing[t].pax8,p.pricing[t].pax10,p.pricing[t].pax12,S.dmc.currency||"INR"]);
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([itHead,itRow]),"Itineraries");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([dwHead,...dwRows]),"Itinerary_DayWise");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([prHead,...prRows]),"Itinerary_Pricing");
 XLSX.writeFile(wb,"MainSite_"+itin_id+"_"+(p.title||"package").replace(/[^A-Za-z0-9]+/g,"_")+".xlsx");}

function newPkg(){S.pkgDraft={pkg_id:"PKG"+Date.now().toString().slice(-6),title:"",days:6,nights:5,category:"Beaches",cities:"",
  base:46000,terms:{deposit_pct:25,balance_due_days:30,commission_pct:12,cancellation_policy:"Free till 7 days",payout_method:"bank"}};
 S.view="pkgnew";render();}
function pricingFor(base){const o={};["3-Star","Deluxe","Premium"].forEach(t=>{const m=TIERMULT[t];
  o[t]={pax2:Math.round(base*m/1000)*1000,pax4:Math.round(base*m*.82/1000)*1000,pax6:Math.round(base*m*.72/1000)*1000,pax8:Math.round(base*m*.75/1000)*1000,pax10:Math.round(base*m*.70/1000)*1000,pax12:Math.round(base*m*.67/1000)*1000};});return o;}
function vPkgNew(){const p=S.pkgDraft,pr=pricingFor(p.base);
 return `<div class="card"><div class="rowb"><h1 style="margin:0">New package</h1><div class="sp"></div><button class="btn ghost" onclick="go('packages')">Cancel</button></div>
  <div class="grid g2"><div><label>Title</label><input id="p_title" value="${esc(p.title)}" placeholder="e.g. Bali Beaches & Temples"></div>
    <div><label>Category</label><select id="p_cat">${["Beaches","Iconic Cities","Culture","Adventure","Deserts"].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join("")}</select></div></div>
  <div class="grid g4"><div><label>Nights</label><input id="p_n" type="number" value="${p.nights}"></div><div><label>Days</label><input id="p_d" type="number" value="${p.days}"></div>
    <div><label>Cities / route</label><input id="p_cities" value="${esc(p.cities)}" placeholder="Ubud, Kuta"></div>
    <div><label>Base price (3★, 2pax, ₹)</label><input id="p_base" type="number" value="${p.base}" oninput="S.pkgDraft.base=+this.value||0;previewPrice()"></div></div>
  <div class="h2" style="margin-top:16px">Pricing matrix (pax × tier) <span class="mut" style="font-size:12px">auto from base — edit base to recompute</span></div>
  <div id="pricebox">${priceTable(pr)}</div>
  <div class="h2" style="margin-top:16px">Payment terms</div>
  <div class="grid g4"><div><label>Deposit %</label><input id="t_dep" type="number" value="${p.terms.deposit_pct}"></div>
    <div><label>Balance due (days before)</label><input id="t_bal" type="number" value="${p.terms.balance_due_days}"></div>
    <div><label>Commission %</label><input id="t_com" type="number" value="${p.terms.commission_pct}"></div>
    <div><label>Payout method</label><select id="t_pm"><option>bank</option><option>wise</option><option>payoneer</option></select></div></div>
  <div><label>Cancellation policy</label><input id="t_can" value="${esc(p.terms.cancellation_policy)}"></div>
  <div class="rowb" style="margin-top:16px"><button class="btn teal" onclick="savePkg('submitted')">Submit for approval →</button>
    <button class="btn ghost" onclick="savePkg('draft')">Save draft</button></div>
  <p class="note">On approval by an admin (${approverFor(S.dmc.country_code)} authority), you can Publish — the package flows into the main marketplace itineraries (source=DMC).</p>
 </div>`;}
function priceTable(pr){return `<table><tr><th>Tier</th><th>2 pax</th><th>4</th><th>6</th><th>8</th><th>10</th><th>12</th></tr>
 ${Object.keys(pr).map(t=>`<tr><td>${t}</td>${["pax2","pax4","pax6","pax8","pax10","pax12"].map(k=>`<td>₹${pr[t][k].toLocaleString('en-IN')}</td>`).join("")}</tr>`).join("")}</table>`;}
function previewPrice(){$("pricebox").innerHTML=priceTable(pricingFor(S.pkgDraft.base));}
function savePkg(status){const p=S.pkgDraft;p.title=$("p_title").value||"Untitled package";p.category=$("p_cat").value;
 p.nights=+$("p_n").value;p.days=+$("p_d").value;p.cities=$("p_cities").value;p.base=+$("p_base").value;
 p.terms={deposit_pct:+$("t_dep").value,balance_due_days:+$("t_bal").value,commission_pct:+$("t_com").value,payout_method:$("t_pm").value,cancellation_policy:$("t_can").value};
 p.pricing=pricingFor(p.base);p.status=status;S.dmc.packages.unshift(p);S.pkgDraft=null;S.view="packages";render();
 if(status==='submitted')setTimeout(()=>{p.status="approved";render();alert('Package approved by admin (demo). Click Publish to push it live.');},1400);}
function publishPkg(id){const p=S.dmc.packages.find(x=>x.pkg_id===id);if(p){p.status="published";render();alert('Published to the main marketplace (demo). It now appears in Itineraries with source=DMC.');}}

/* PAYOUTS */
function vPayouts(){const d=S.dmc;
 return `<div class="card"><h1>Payouts</h1><p class="mut">Deposit on booking, balance before travel. Commission = your set %.</p>
  ${d.payouts.length?`<table><tr><th>Payout</th><th>Booking</th><th>Type</th><th>Gross</th><th>Commission</th><th>Net</th><th>Status</th></tr>
   ${d.payouts.map(p=>`<tr><td>${p.payout_id}</td><td>${p.booking_id}</td><td>${p.type}</td><td>₹${p.gross.toLocaleString('en-IN')}</td><td>₹${p.commission.toLocaleString('en-IN')}</td><td>₹${p.net_to_dmc.toLocaleString('en-IN')}</td><td><span class="pill st-${p.status==='released'?'approved':'submitted'}">${p.status}</span></td></tr>`).join("")}</table>`
   :`<p class="mut" style="margin-top:10px">No payouts yet — they appear after bookings.</p>`}</div>`;}

loadData().then(render);
</script></body></html>
